name: Draw the sky

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["*.py", ".github/workflows/draw.yml"]

permissions:
  contents: write

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Draw this year's sky from the contribution calendar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WHO: ${{ github.repository_owner }}
        run: |
          mkdir -p dist
          python galaxy.py --user "$WHO" --out dist/galaxy.svg
          python starchart.py --user "$WHO" --out dist/starchart.svg
      - name: Keep the new pictures
        run: |
          git config user.name "${{ github.repository_owner }}"
          git config user.email "${{ github.repository_owner_id }}+${{ github.repository_owner }}@users.noreply.github.com"
          git add dist
          git diff --cached --quiet || git commit -m "Draw the sky for $(date -u +%Y-%m-%d)"
          git push
